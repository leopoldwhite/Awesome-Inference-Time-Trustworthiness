<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Solid blue rounded tile (max contrast at 16px tab size) -->
  <rect width="32" height="32" rx="5" fill="#1859c2"/>

  <!-- "ITC" monogram for Inference-Time Control -->
  <text x="16" y="22.5"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter',
                     'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13"
        font-weight="700"
        letter-spacing="-0.4"
        text-anchor="middle"
        fill="#ffffff">ITC</text>
</svg>
